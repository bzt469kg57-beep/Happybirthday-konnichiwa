<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--ink:#071a38;--blue:#1f45d6;--paper:#eef2fb;--lemon:#ece35a;--pink:#f5a9c4;
--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);line-height:1.5}
img{display:block;max-width:100%}
a:focus-visible,button:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}

.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:saturate(1.1)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(7,26,56,.25) 0%,rgba(7,26,56,0) 35%,rgba(7,26,56,.92) 100%)}
.hud{position:absolute;z-index:2;left:20px;right:20px;top:calc(20px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rec{display:flex;align-items:center;gap:8px}
.rec i{width:12px;height:12px;border-radius:50%;background:#ff3b3b;animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:0}}
.corner{position:absolute;z-index:2;width:28px;height:28px;border:3px solid rgba(255,255,255,.85)}
.c1{left:14px;top:calc(56px + env(safe-area-inset-top,0px));border-right:0;border-bottom:0}
.c2{right:14px;top:calc(56px + env(safe-area-inset-top,0px));border-left:0;border-bottom:0}
.hero-text{position:relative;z-index:2;padding:0 20px 36px;width:100%;max-width:760px}
.hero h1{margin:0;font-size:clamp(3.4rem,17vw,8rem);line-height:.88;font-weight:800;letter-spacing:-.03em}
.hero p{margin:16px 0 0;font-size:1.15rem;max-width:30ch}
.stamp{margin-top:20px;font-size:14px;font-weight:600;color:var(--lemon)}

main{max-width:760px;margin:0 auto;padding:0 20px}
.details{padding:56px 0 8px}
.details h2,.gallery h2{margin:0 0 20px;font-size:1.9rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}
dl{margin:0}
.row{display:grid;grid-template-columns:7rem 1fr;gap:12px;padding:16px 0;border-top:2px solid var(--blue)}
.row:last-child{border-bottom:2px solid var(--blue)}
dt{color:var(--pink);font-weight:600}
dd{margin:0;font-size:1.25rem;font-weight:600;line-height:1.3}

.music{padding:32px 0 0}
.music h2{margin:0 0 16px;font-size:1.9rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.music iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
.gallery{padding:48px 0 0}
.gallery h2{padding:0 20px;max-width:760px;margin:0 auto 20px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 28px;-webkit-overflow-scrolling:touch}
.strip figure{margin:0;flex:0 0 min(68vw,280px);scroll-snap-align:center;background:#000;padding:8px;border-radius:6px;border:2px solid var(--blue)}
.strip img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:2px}
.foot{padding:16px 20px calc(48px + env(safe-area-inset-bottom,0px));font-size:1.15rem;text-align:center;color:var(--pink);font-weight:600}
.music{position:fixed;z-index:10;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;background:var(--lemon);color:var(--ink);border:0;border-radius:999px;padding:12px 18px;font:800 15px var(--font);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.music.on{display:flex}
.music .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.music .bars i{width:3px;background:var(--ink);height:4px;border-radius:1px}
.music.playing .bars i{animation:eq .8s ease-in-out infinite alternate}
.music.playing .bars i:nth-child(2){animation-delay:.2s}.music.playing .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:14px}}
@media(min-width:760px){.hero{align-items:center}.hero-text{margin-left:max(20px,calc((100vw - 760px)/2))}}
@media(prefers-reduced-motion:reduce){.rec i,.music .bars i{animation:none}}
</style>
</head>
